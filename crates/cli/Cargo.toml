[package]
name = "rsdirstat-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "rsdirstat-cli"
path = "src/main.rs"

[dependencies]
rsdirstat-core.workspace = true
rsdirstat-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
humansize = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
rsdirstat-macos = { path = "../macos" }

[target.'cfg(target_os = "linux")'.dependencies]
rsdirstat-linux = { path = "../linux" }

[target.'cfg(target_os = "windows")'.dependencies]
rsdirstat-windows = { path = "../windows" }
