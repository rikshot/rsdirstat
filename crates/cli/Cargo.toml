[package]
name = "rsdirstat-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "rsdirstat"
path = "src/main.rs"

[dependencies]
rsdirstat-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humansize = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rsdirstat-macos = { path = "../macos" }

[target.'cfg(target_os = "linux")'.dependencies]
rsdirstat-linux = { path = "../linux" }

[target.'cfg(target_os = "windows")'.dependencies]
rsdirstat-windows = { path = "../windows" }
