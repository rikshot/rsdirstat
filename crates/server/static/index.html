<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>rsdirstat</title>
        <link rel="stylesheet" href="/main.css" />
        <link rel="modulepreload" href="/main.js" />
        <link rel="modulepreload" href="/protocol.js" />
        <link rel="modulepreload" href="/util.js" />
        <link rel="modulepreload" href="/render.js" />
        <link rel="modulepreload" href="/parser.js" />
        <link rel="modulepreload" href="/events.js" />
        <link rel="modulepreload" href="/toolbar.js" />
    </head>
    <body>
        <div id="breadcrumb-bar">
            <div id="crumbs"></div>
            <span id="status">Connecting...</span>
        </div>
        <div id="toolbar">
            <div class="toolbar-group">
                <label>Depth</label>
                <select id="depth">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option selected>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Color</label>
                <select id="color-mode">
                    <option value="0">Type</option>
                    <option value="1">Age</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label>Ext</label>
                <input type="text" id="filter-ext" placeholder="e.g. mp4,jpg" />
                <label>Name</label>
                <input type="text" id="filter-name" placeholder="search..." />
                <label>Min</label>
                <input type="number" id="filter-min" placeholder="0" min="0" />
                <select id="filter-min-unit">
                    <option value="1">B</option>
                    <option value="1024">KiB</option>
                    <option value="1048576" selected>MiB</option>
                    <option value="1073741824">GiB</option>
                </select>
                <button id="filter-clear">Clear</button>
            </div>
            <button id="rescan" class="hidden">Rescan</button>
        </div>
        <canvas id="treemap"></canvas>
        <div id="path-bar">
            <span id="path-text"></span>
            <span id="path-size"></span>
        </div>
        <div id="tooltip">
            <div class="tip-name"></div>
            <div class="tip-size"></div>
            <div class="tip-percent"></div>
            <div class="tip-mtime"></div>
        </div>
        <script type="module" src="/main.js"></script>
    </body>
</html>
