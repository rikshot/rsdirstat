[package]
name = "rsdirstat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "rsdirstat-server"
path = "src/main.rs"

[dependencies]
rsdirstat-core.workspace = true
rsdirstat-protocol.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap.workspace = true
mimalloc = "0.1"
open = "5"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "parking_lot"] }
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "compression-zstd"] }

[dev-dependencies]
playwright-rs = { version = "0.14", features = ["screenshot-diff"] }
futures-util = "0.3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rsdirstat-macos = { path = "../macos" }

[target.'cfg(target_os = "linux")'.dependencies]
rsdirstat-linux = { path = "../linux" }

[target.'cfg(target_os = "windows")'.dependencies]
rsdirstat-windows = { path = "../windows" }
