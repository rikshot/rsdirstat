[package]
name = "rsdirstat-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
rsdirstat-core = { path = "../core" }
rsdirstat-macos = { path = "../macos" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
humansize = "2"
mimalloc = "0.1"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "parking_lot"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
