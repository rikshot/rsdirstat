[package]
name = "rsdirstat-windows"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows filesystem scanner for rsdirstat (GetFileInformationByHandleEx)"
categories = ["filesystem", "os::windows-apis"]

# docs.rs builds on Linux by default; this crate only compiles for Windows, so point
# its docs build at a Windows target (rustdoc type-checks without linking).
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[dependencies]
rsdirstat-core.workspace = true
rsdirstat-protocol.workspace = true
anyhow.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }
dashmap.workspace = true
