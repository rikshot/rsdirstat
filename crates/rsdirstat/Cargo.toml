[package]
name = "rsdirstat"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
default-run = "rsdirstat"
# The frontend bundle in `dist/` is a build artifact (git-ignored, produced by `trunk`);
# `include` forces it into the published tarball so the embedded assets ship. `tests/` are
# left out of the package. `LICENSE` is a copy of the workspace one, as in every published
# crate: cargo can't package a file from outside the crate directory.
include = ["src/**/*", "dist/**/*", "LICENSE"]

# Two binaries, auto-discovered: `src/main.rs` -> `rsdirstat` (the GUI server, default),
# `src/bin/rsdirstat-cli.rs` -> `rsdirstat-cli` (the top-N reporter).

[dependencies]
rsdirstat-core.workspace = true
rsdirstat-protocol.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap.workspace = true
getrandom = "0.3"
mimalloc = "0.1"
open = "5"
parking_lot = "0.12"
rust-embed = { version = "8", features = ["mime-guess"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "parking_lot"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "compression-zstd"] }

[dev-dependencies]
playwright-rs = { version = "0.20", features = ["screenshot-diff"] }
futures-util = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
rsdirstat-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rsdirstat-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
rsdirstat-windows.workspace = true
