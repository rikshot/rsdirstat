name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo. Codecov uploads with its own token
# and upload-artifact uses the Actions runtime token, so neither needs write scope.
permissions:
  contents: read

# Cancel superseded runs for the same ref — but only on pull requests, so every push to
# main keeps its own CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Each scanner crate is empty off its own OS, so every runner lints and tests the whole workspace,
  # its own scanner included.
  lint:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings

  # Every test, unit and browser, in one instrumented run per OS, so both halves share one build.
  # The browser tests drive the server binary as a subprocess and stop it cleanly (SIGTERM, or
  # Ctrl+Break on Windows), so its coverage is written on every OS too. Each OS runner covers its own
  # native scanner, unit tests included; Codecov merges the three uploads (keyed by flag).
  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest,trunk,cargo-llvm-cov
      - uses: ./.github/actions/setup-playwright
      # Build the frontend up front, outside the instrumented test run. The test harness only
      # rebuilds a bundle that is missing or older than its sources, so here it never has to.
      - run: trunk build
      - run: cargo llvm-cov nextest --locked --profile ci --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # The visual tests compare against the committed per-OS baselines and, on a mismatch, write
      # `<name>-actual.png` and `<name>-diff.png` next to them. Upload those so a failure (or a
      # retried flake) can be seen without reproducing it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-diffs-${{ matrix.os }}
          path: |
            crates/rsdirstat/tests/snapshots/*/*-actual.png
            crates/rsdirstat/tests/snapshots/*/*-diff.png
          if-no-files-found: ignore
          retention-days: 14
      # Playwright traces are written only for failing browser tests (retain-on-failure);
      # upload them so a red cross-OS run is debuggable without reproducing locally. `always()`
      # rather than `failure()`: a test that fails and then passes on retry leaves its trace
      # behind in a green job, and those flakes are the ones hardest to reproduce.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: crates/rsdirstat/tests/traces/
          if-no-files-found: ignore
          retention-days: 14

  # Enforce the declared MSRV (rust-version = "1.89"): if a dependency bump or a
  # 2024-edition feature raises the real floor, `cargo install rsdirstat` breaks for
  # users on 1.89 — catch it here. No `--all-targets`: dev-deps (playwright-rs) have a
  # higher MSRV and users never build the tests.
  # `build-warnings: ""` drops the action's default `CARGO_BUILD_WARNINGS=deny` so a warning
  # under an older rustc can't fail the check (cargo 1.89 predates `build.warnings` anyway).
  msrv:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.89"
          build-warnings: ""
      - run: cargo check --locked

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: trunk
      - run: trunk build --release
      - run: cargo build --locked --release
