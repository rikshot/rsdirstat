name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --locked --profile ci -E 'not test(/^visual/) and not test(/^e2e/)'

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: trunk build --release
      - run: cargo build --locked --release

  browser:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,trunk
      - uses: actions/cache@v5
        with:
          key: playwright-1.60.0-${{ runner.os }}
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/playwright-rust
            ~/AppData/Local/playwright-rust
      # Provision the driver + browsers via playwright-rs's own `install` CLI. It downloads the
      # driver into the OS user cache (~/.cache/playwright-rust/<version>/), which the library's
      # runtime resolver probes after the build.rs-baked path. Because that cache is independent of
      # the build's target/, it survives compile caching — so we no longer need the old
      # `cargo clean -p playwright-rs` dance (which forced build.rs to re-download into target/), nor
      # Node/npx. Pin the CLI to the same version as the dev-dependency so the bundled driver matches.
      - run: cargo install --locked playwright-rs@0.13.0 --features cli
      - run: playwright-rs install --with-deps chromium firefox webkit
      - uses: actions/cache@v5
        with:
          key: visual-baselines-v3-${{ matrix.os }}
          path: crates/server/tests/snapshots/
      # Build the frontend once here: nextest runs each test in its own process, so leaving the
      # bundle to the test harness would launch many concurrent `trunk build`s that race.
      - run: trunk build
      - run: cargo nextest run --locked --profile ci -E 'test(/^visual/) or test(/^e2e/)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots-${{ matrix.os }}
          path: crates/server/tests/snapshots/
