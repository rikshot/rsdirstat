name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile ci -E 'not test(/^visual/) and not test(/^e2e/)'

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release

  browser:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          key: playwright-1.58.2-${{ runner.os }}
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/playwright-rust
            ~/AppData/Local/playwright-rust
            drivers
      - run: npx playwright@1.58.2 install --with-deps chromium firefox webkit
      - uses: actions/cache@v5
        with:
          key: visual-baselines-v1-${{ matrix.os }}
          path: crates/gui/tests/snapshots/
      - run: cargo nextest run --profile ci -E 'test(/^visual/) or test(/^e2e/)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots-${{ matrix.os }}
          path: crates/gui/tests/snapshots/
