name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --no-deps -- -D warnings

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      # Run the (non-browser) tests under instrumentation and emit lcov. Each OS runner
      # covers its own native scanner; Codecov merges the three uploads (keyed by flag).
      - run: cargo llvm-cov nextest --locked --profile ci -E 'not test(/^visual/) and not test(/^e2e/)' --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: trunk build --release
      - run: cargo build --locked --release

  browser:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,trunk,cargo-llvm-cov
      - uses: actions/cache@v5
        with:
          key: playwright-1.60.0-${{ runner.os }}
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/playwright-rust
            ~/AppData/Local/playwright-rust
      # Provision the driver + browsers via playwright-rs's own `install` CLI. It downloads the
      # driver into the OS user cache (~/.cache/playwright-rust/<version>/), which the library's
      # runtime resolver probes after the build.rs-baked path. Because that cache is independent of
      # the build's target/, it survives compile caching — so we no longer need the old
      # `cargo clean -p playwright-rs` dance (which forced build.rs to re-download into target/), nor
      # Node/npx. Pin the CLI to the same version as the dev-dependency so the bundled driver matches.
      - run: cargo install --locked playwright-rs@0.14.0 --features cli
      - run: playwright-rs install --with-deps chromium firefox webkit
      - uses: actions/cache@v5
        with:
          key: visual-baselines-v4-${{ matrix.os }}
          path: crates/rsdirstat/tests/snapshots/
      # Build the frontend once here: nextest runs each test in its own process, so leaving the
      # bundle to the test harness would launch many concurrent `trunk build`s that race.
      - run: trunk build
      # Run under instrumentation: the e2e/visual tests drive the server binary as a
      # subprocess, so this captures server/main.rs coverage that the unit `test` job can't.
      # The server flushes coverage on SIGTERM (graceful shutdown); Windows hard-kills it,
      # so only the unix runners contribute server coverage — merged in by Codecov.
      - run: cargo llvm-cov nextest --locked --profile ci -E 'test(/^visual/) or test(/^e2e/)' --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: browser-${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots-${{ matrix.os }}
          path: crates/rsdirstat/tests/snapshots/
      # Playwright traces are written only for failing browser tests (retain-on-failure);
      # upload them so a red cross-OS run is debuggable without reproducing locally.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: crates/rsdirstat/tests/traces/
          if-no-files-found: ignore
