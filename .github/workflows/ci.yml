name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets --no-deps -- -D warnings

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --profile ci -E 'not test(/^visual/) and not test(/^e2e/)'

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: trunk build --release
      - run: cargo build --release

  browser:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,trunk
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v5
        with:
          key: playwright-1.58.2-${{ runner.os }}
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/playwright-rust
            ~/AppData/Local/playwright-rust
            drivers
      - run: npx playwright@1.58.2 install --with-deps chromium firefox webkit
      - uses: actions/cache@v5
        with:
          key: visual-baselines-v2-${{ matrix.os }}
          path: crates/server/tests/snapshots/
      # Build the frontend once here: nextest runs each test in its own process, so leaving the
      # bundle to the test harness would launch many concurrent `trunk build`s that race.
      - run: trunk build
      - run: cargo nextest run --profile ci -E 'test(/^visual/) or test(/^e2e/)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-snapshots-${{ matrix.os }}
          path: crates/server/tests/snapshots/
