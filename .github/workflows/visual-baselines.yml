name: Update visual baselines

# Re-record the committed visual-test baselines on CI's own runners, one set per OS. Run it after an
# intentional change to what the treemap draws, or when a playwright-rs update brings new browser
# builds: push the change, run this workflow on that branch, then download the results into the
# repo with `scripts/download-visual-baselines.sh`, review them, and commit.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  record:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            dir: linux
          - os: macos-latest
            dir: macos
          - os: windows-latest
            dir: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: nextest,trunk
      - uses: ./.github/actions/setup-playwright
      - run: trunk build
      # Same profile and environment as the CI test job (`CI` is set on every runner, so the
      # tests write to `tests/snapshots/<os>/`), but recording instead of comparing.
      - run: cargo nextest run --locked --profile ci -E 'test(/^visual/)'
        env:
          RSDIRSTAT_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-${{ matrix.dir }}
          path: crates/rsdirstat/tests/snapshots/${{ matrix.dir }}/*.png
          if-no-files-found: error
          retention-days: 14
