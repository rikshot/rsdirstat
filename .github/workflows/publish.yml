name: Publish

# Publish the workspace to crates.io when a version tag is pushed. Prebuilt binaries
# and the GitHub Release are handled separately by release.yml (cargo-dist), which
# triggers on the same tags.
on:
  push:
    tags: ["v*"]

# Trusted Publishing: the job proves its identity to crates.io with a GitHub OIDC
# token and exchanges it for a short-lived registry token — no stored API secret.
# `id-token: write` is required to mint the OIDC token; `contents: read` to check out.
permissions:
  contents: read
  id-token: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    # Optional gate: configure required reviewers on this environment (and name it in
    # the crate's Trusted Publishing settings) to require a human approval per release.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: trunk
      # `rsdirstat` embeds the frontend from `dist/` (rust-embed) and `include`s it in
      # the package tarball, so the release bundle must exist before packaging.
      - run: trunk build --release
      # Exchange the OIDC token for a 30-minute crates.io token.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # `--workspace` publishes every non-`publish=false` member in dependency order
      # (protocol → core → {linux,macos,windows} → rsdirstat), skipping the wasm crate.
      # `--no-verify`: the macOS/Windows scanner crates can't compile on this Linux
      # runner (native platform APIs), so skip the per-crate verify build — CI already
      # built and tested every crate on its native OS at this commit.
      # `--allow-dirty`: `dist/` is git-ignored (a build artifact) but must ship.
      - run: cargo publish --workspace --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
