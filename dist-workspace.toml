[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The Homebrew tap the formula is pushed to (`brew install rikshot/tap/rsdirstat`)
tap = "rikshot/homebrew-tap"
# Publish the formula on release, using the HOMEBREW_TAP_TOKEN secret
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Build only the `rsdirstat` package (`cargo build --package`), the one that ships,
# not the whole workspace (the browser frontend crate is built by trunk instead).
precise-builds = true
# Run `trunk build --release` before each binary build so rust-embed can embed the
# compiled frontend bundle into the `rsdirstat` binary (see .github/build-setup.yml).
github-build-setup = "../build-setup.yml"
