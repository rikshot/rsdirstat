<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>rsdirstat</title>
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>
        <div id="breadcrumb-bar">
            <div id="crumbs"></div>
            <span id="status">Connecting...</span>
        </div>
        <div id="toolbar">
            <label>Depth</label>
            <select id="tb-depth">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option selected>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
            </select>
            <span class="sep">|</span>
            <label>Color</label>
            <select id="tb-color">
                <option value="0">Type</option>
                <option value="1">Age</option>
            </select>
            <span class="sep">|</span>
            <label>Filter ext</label>
            <input type="text" id="tb-filter-ext" placeholder="e.g. mp4,jpg" />
            <label>Name</label>
            <input type="text" id="tb-filter-name" placeholder="search..." />
            <label>Min</label>
            <input type="number" id="tb-filter-min" placeholder="0" min="0" />
            <select id="tb-filter-min-unit">
                <option value="1">B</option>
                <option value="1024">KiB</option>
                <option value="1048576" selected>MiB</option>
                <option value="1073741824">GiB</option>
            </select>
            <button id="tb-filter-clear">Clear</button>
            <span class="sep">|</span>
            <button id="tb-rescan" style="display: none">Rescan</button>
        </div>
        <canvas id="treemap"></canvas>
        <div id="path-bar">
            <span id="path-text"></span>
            <span id="path-size"></span>
        </div>
        <div id="tooltip">
            <div class="tt-name"></div>
            <div class="tt-size"></div>
            <div class="tt-pct"></div>
            <div class="tt-mtime"></div>
        </div>
        <script type="module" src="/main.js"></script>
    </body>
</html>
