[workspace]
members = ["crates/*"]
default-members = ["crates/cli", "crates/core", "crates/protocol", "crates/server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
description = "Fast, cross-platform disk usage analyzer with a treemap GUI"
repository = "https://github.com/rikshot/rsdirstat"

[workspace.dependencies]
rsdirstat-core = { path = "crates/core" }
rsdirstat-protocol = { path = "crates/protocol" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dashmap = { version = "6", features = ["inline"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
