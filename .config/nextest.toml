[profile.default]
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/^visual/)'
slow-timeout = { period = "120s", terminate-after = 2 }

# Retries are for the browser tests only: they drive three real browsers on shared CI runners.
# Everything else must pass first time, so a flaky unit or scanner test fails CI instead of
# hiding behind a retry. A retried test still shows up as FLAKY, with its trace uploaded.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }

# The default profile's overrides apply here too, after these, so the visual tests keep their
# timeout.
[[profile.ci.overrides]]
filter = 'test(/^visual/)'
retries = 1

# The browser tests only: the e2e binary's tests that drive the server without a browser are named
# `server_*`, and must pass first time like any other.
[[profile.ci.overrides]]
filter = 'test(/^e2e/)'
retries = 2
