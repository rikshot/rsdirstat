[profile.default]
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.ci]
retries = 2
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/^visual/)'
slow-timeout = { period = "120s", terminate-after = 2 }
threads-required = 1

[[profile.ci.overrides]]
filter = 'test(/^visual/)'
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 1
threads-required = 1
